<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><title>Exercício 1 - Primos, neutros e negativos</title>
<style>body{font-family:Arial;max-width:800px;margin:40px auto;padding:20px} .enunciado{background:#f2f7fc;padding:12px;border-left:4px solid #5b9bd5} button{background:#e67e22;color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:16px} pre{background:#1e1e2e;color:#e6edf3;padding:12px;border-radius:6px;white-space:pre-wrap}</style>
</head><body>
<h1>Exercício 1</h1>
<p class="enunciado">Ler números via prompt continuamente e parar quando 3 negativos iguais seguidos forem digitados. Mostrar: quantidade de primos, quíntuplo de neutros (0), soma dos negativos.</p>
<button id="btn">▶ Executar</button>
<pre id="saida"></pre>
<p><a href="index.html">← Voltar</a></p>
<script>
function ehPrimo(n){
  if(n<2) return false;
  for(let i=2;i<n;i++) if(n%i===0) return false;
  return true;
}
document.getElementById('btn').onclick=()=>{
  let numeros=[];
  while(true){
    let n=Number(prompt("Digite um número:"));
    if(isNaN(n)) continue;
    numeros.push(n);
    let t=numeros.length;
    if(t>=3 && n<0 && n===numeros[t-2] && n===numeros[t-3]) break;
  }
  let primos=0, neutros=0, somaNeg=0;
  for(let n of numeros){
    if(ehPrimo(n)) primos++;
    if(n===0) neutros++;
    if(n<0) somaNeg+=n;
  }
  let msg=`Digitados: [${numeros.join(", ")}]\nPrimos: ${primos}\nNeutros: ${neutros} | Quíntuplo: ${neutros*5}\nSoma negativos: ${somaNeg}`;
  document.getElementById('saida').textContent=msg;
  alert(msg);
};
</script></body></html>
