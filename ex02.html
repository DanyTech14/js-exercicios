<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><title>Exercício 2 - Rotação 360 nos 5</title>
<style>body{font-family:Arial;max-width:800px;margin:40px auto;padding:20px} .enunciado{background:#f2f7fc;padding:12px;border-left:4px solid #5b9bd5} button{background:#e67e22;color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:16px} input{font-size:20px;padding:10px;width:100%} #saida{font-size:42px;letter-spacing:8px;margin-top:20px;min-height:60px;text-align:center} .girar{display:inline-block;color:#e67e22;font-weight:bold;animation:girar 1.5s linear infinite} @keyframes girar{to{transform:rotate(360deg)}}</style>
</head><body>
<h1>Exercício 2</h1>
<p class="enunciado">Escreve números no input. Todos os dígitos 5 fazem rotação de 360° sem afetar os outros.</p>
<input type="text" id="entrada" placeholder="Ex: 1 5 2 5 3">
<div id="saida"></div>
<p><a href="index.html">← Voltar</a></p>
<script>
const entrada=document.getElementById('entrada'), saida=document.getElementById('saida');
entrada.addEventListener('input',()=>{
  saida.innerHTML=entrada.value.split('').map(c=> c==='5' ? '<span class="girar">5</span>' : (c===' ' ? '&nbsp;' : c)).join('');
});
</script></body></html>
