<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><title>Exercício 11 - Maiúsculas/minúsculas intercaladas</title>
<style>body{font-family:Arial;max-width:800px;margin:40px auto;padding:20px} .enunciado{background:#f2f7fc;padding:12px;border-left:4px solid #5b9bd5} button{background:#e67e22;color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:16px} pre{background:#1e1e2e;color:#e6edf3;padding:12px;border-radius:6px;white-space:pre-wrap}</style>
</head><body>
<h1>Exercício 11</h1>
<p class="enunciado">Frase minúscula intercalada com maiúsculas. Ex: seja autodidata. → sEjA AuToDiDaTa.</p>
<button id="btn">▶ Executar</button>
<pre id="saida"></pre>
<p><a href="index.html">← Voltar</a></p>
<script>
document.getElementById('btn').onclick=()=>{
  let frase=(prompt("Frase minúscula:")||"").toLowerCase();
  if(!frase) return;
  let res=frase.split(' ').map(p=>p.split('').map((l,i)=>{
    if(/[a-záéíóúâêôãõç]/.test(l)) return i%2===0?l:l.toUpperCase();
    return l;
  }).join('')).join(' ');
  document.getElementById('saida').textContent=res;
  alert(res);
};
</script></body></html>
