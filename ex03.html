<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><title>Exercício 3 - Soma e fatorial</title>
<style>body{font-family:Arial;max-width:800px;margin:40px auto;padding:20px} .enunciado{background:#f2f7fc;padding:12px;border-left:4px solid #5b9bd5} button{background:#e67e22;color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:16px} pre{background:#1e1e2e;color:#e6edf3;padding:12px;border-radius:6px;white-space:pre-wrap}</style>
</head><body>
<h1>Exercício 3</h1>
<p class="enunciado">Receber números via prompt separados por ; somar todos e calcular o fatorial da soma.</p>
<button id="btn">▶ Executar</button>
<pre id="saida"></pre>
<p><a href="index.html">← Voltar</a></p>
<script>
function fatorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
document.getElementById('btn').onclick=()=>{
  let texto=prompt("Digite números separados por ; (ex: 2;3;4):");
  if(!texto) return;
  let soma=texto.split(';').reduce((acc,p)=>acc+Number(p.trim()),0);
  let msg;
  if(!Number.isInteger(soma)||soma<0) msg=`Soma = ${soma}\nFatorial só para inteiro >=0`;
  else msg=`Soma = ${soma}\n${soma}! = ${fatorial(soma)}`;
  document.getElementById('saida').textContent=msg;
  alert(msg);
};
</script></body></html>
